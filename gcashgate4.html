<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate 4: Strict Color, Aspect Ratio & Hierarchy Inspector</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 540px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; font-size: 18px; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #cbd5e1; font-weight: bold; }
        
        input[type="file"] { 
            width: 100%; color: #fff; padding: 12px; background: #0284c7; border: none; border-radius: 6px; box-sizing: border-box; cursor: pointer; font-weight: bold;
        }

        .view-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #34d399; word-break: break-all; min-height: 20px; }
        .status { font-size: 12px; color: #fbbf24; font-style: italic; margin-bottom: 10px; text-align: center; }
        .preview-container { text-align: center; margin-bottom: 15px; }
        .preview-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; background: #000; border: 1px solid #38bdf8; display: none; margin-top: 5px; }
        .comparison-box { padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
        .match-verified { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .fake-not-match { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
        .color-box { display: inline-block; width: 14px; height: 14px; vertical-align: middle; border-radius: 3px; margin-right: 5px; border: 1px solid #fff; }
    </style>
</head>
<body>

<div class="card">
    <h2>Gate 4: Strict Color & Proportion Inspector</h2>
    
    <div class="form-group">
        <label>Pumili ng Larawan ng Resibo:</label>
        <input type="file" id="testFile" onchange="runStrictInspection(event)">
    </div>

    <div class="preview-container">
        <label>📸 Preview:</label>
        <img id="imagePreview" class="preview-img" alt="Preview">
    </div>
    
    <div id="statusMsg" class="status">Mag-upload ng resibo upang simulan ang mahigpit na pagsusuri...</div>

    <div class="form-group">
        <label>📏 Resolution & Aspect Ratio Check:</label>
        <div id="dimensionView" class="view-box">-- Naghihintay --</div>
    </div>

    <div class="form-group">
        <label>🎨 Strict GCash Blue Color Check (#0056E3):</label>
        <div id="colorView" class="view-box">-- Naghihintay --</div>
    </div>

    <div class="form-group">
        <label>🔤 Font Hierarchy & Proportion Analysis:</label>
        <div id="fontPropView" class="view-box" style="white-space: pre-wrap;">-- Naghihintay --</div>
    </div>

    <div id="testResult" class="comparison-box"></div>
</div>

<script>
// Helper para kalkulahin ang layo ng kulay (Color Distance) mula sa official GCash Blue (#0056E3 -> R:0, G:86, B:227)
function getColorDistance(r, g, b) {
    const targetR = 0, targetG = 86, targetB = 227;
    return Math.sqrt(Math.pow(r - targetR, 2) + Math.pow(g - targetG, 2) + Math.pow(b - targetB, 2));
}

async function runStrictInspection(event) {
    const file = event.target.files[0];
    const statusMsg = document.getElementById('statusMsg');
    const dimensionView = document.getElementById('dimensionView');
    const colorView = document.getElementById('colorView');
    const fontPropView = document.getElementById('fontPropView');
    const imagePreview = document.getElementById('imagePreview');
    const testResult = document.getElementById('testResult');

    if (!file) return;

    testResult.style.display = 'none';
    dimensionView.innerText = "-- Sinusuri ang sukat --";
    colorView.innerText = "-- Sinusuri ang kulay --";
    fontPropView.innerText = "-- Sinusuri ang proporsiyon --";
    statusMsg.innerText = "⏳ Isinasagawa ang mahigpit na pagsusuri...";

    const reader = new FileReader();
    reader.onload = async function(e) {
        const img = new Image();
        img.onload = async function() {
            const width = img.width;
            const height = img.height;
            const aspectRatio = width / height;

            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';

            dimensionView.innerText = `${width} x ${height} px (Aspect Ratio: ${aspectRatio.toFixed(3)})`;

            // 1. Strict Aspect Ratio Validation (Ang GCash ay dapat Portrait, ~0.40 hanggang 0.50)
            const isPortraitReceipt = (aspectRatio >= 0.40 && aspectRatio <= 0.52);

            // 2. Canvas Color Sampling & Strict Distance Check
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0);

            const sampleX = Math.floor(width / 2);
            const sampleY = Math.floor(height * 0.03); 
            const pixelData = ctx.getImageData(sampleX, sampleY, 1, 1).data;
            const r = pixelData[0], g = pixelData[1], b = pixelData[2];
            const hexColor = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            
            colorView.innerHTML = `<span class="color-box" style="background-color: ${hexColor};"></span> ${hexColor} (RGB: ${r}, ${g}, ${b})`;

            // Kunin ang color distance mula sa tunay na GCash blue. Ang limit ay dapat mababa sa 65.
            const colorDist = getColorDistance(r, g, b);
            const isStrictBlueValid = (colorDist <= 65);

            // 3. OCR & Hierarchy Check
            statusMsg.innerText = "⏳ Sinusuri ang font proportions...";
            
            try {
                const result = await Tesseract.recognize(file, 'eng');
                const words = result.data.words;

                let totalHeight = 0;
                let refNumHeight = 0;
                let reportLogs = [];
                let isFakeHierarchy = false;

                const scaleFactor = height / 2720;

                words.forEach(w => {
                    const text = w.text.trim();
                    const rawHeight = w.bbox.y1 - w.bbox.y0;
                    const normalizedHeight = Math.round(rawHeight / scaleFactor);

                    if (/total/i.test(text) || (/₱/i.test(text) && rawHeight > height * 0.018)) {
                        if (normalizedHeight > totalHeight) totalHeight = normalizedHeight;
                    }
                    if (/ref|reference/i.test(text) || (/^\d{8,13}$/.test(text) && w.bbox.y0 > height * 0.5)) {
                        if (normalizedHeight > refNumHeight) refNumHeight = normalizedHeight;
                    }
                });

                reportLogs.push(`• Calculated Aspect Ratio: ${aspectRatio.toFixed(3)} (Standard: ~0.45)`);
                reportLogs.push(`• Color Distance from #0056E3: ${colorDist.toFixed(1)} (Max allowed: 65)`);
                reportLogs.push(`• TOTAL Height Norm: ~${totalHeight}px | REF Height Norm: ~${refNumHeight}px`);

                if (totalHeight > 0 && refNumHeight > 0 && refNumHeight >= totalHeight) {
                    isFakeHierarchy = true;
                    reportLogs.push(`❌ Hierarchy Error: Pantay o mas malaki ang Ref No sa Total!`);
                }

                fontPropView.innerText = reportLogs.join('\n');

                testResult.style.display = 'block';

                // Pinal na Desisyon: Lahat ay dapat pumasa sa mahigpit na patakaran
                if (isPortraitReceipt && isStrictBlueValid && !isFakeHierarchy) {
                    testResult.className = "comparison-box match-verified";
                    testResult.innerHTML = `Gate 4 Strict Check Passed ✅<br><span style="font-size:11px; font-weight:normal;">Wasto ang aspect ratio, eksaktong tugma ang GCash blue shade, at tama ang hierarchy!</span>`;
                    statusMsg.innerText = "✅ Matagumpay na naipasa ang mahigpit na pagsusuri.";
                } else {
                    testResult.className = "comparison-box fake-not-match";
                    let reason = "";
                    if (!isPortraitReceipt) reason = "Mali ang sukat/orientation (Hindi ito portrait GCash screenshot).";
                    else if (!isStrictBlueValid) reason = "Maling shade ng asul (Hindi opisyal na GCash blue, posibleng gawa sa Canva o in-edit).";
                    else if (isFakeHierarchy) reason = "Mali ang font hierarchy (In-edit ang sukat ng text).";

                    testResult.innerHTML = `Gate 4 Failed ❌ (Huli sa Mahigpit na Pagsusuri)<br><span style="font-size:11px; font-weight:normal;">${reason}</span>`;
                    statusMsg.innerText = "⚠️ Nai-reject ang resibo dahil hindi tugma sa opisyal na pamantayan!";
                }

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ Error sa pagbasa ng OCR.";
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
