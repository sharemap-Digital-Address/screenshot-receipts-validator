<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple-Gate Anti-Fake Receipt Inspector</title>
    <!-- Tesseract.js CDN para sa Browser OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; font-size: 18px; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #cbd5e1; font-weight: bold; }
        
        /* Pinalitan ang file input para maging button-like at buksan ang File Manager */
        input[type="file"] { 
            width: 100%; 
            color: #fff; 
            padding: 12px; 
            background: #0284c7; 
            border: none; 
            border-radius: 6px; 
            box-sizing: border-box;
            cursor: pointer;
            font-weight: bold;
        }

        .view-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #34d399; word-break: break-all; min-height: 20px; }
        .json-box { font-size: 11px; color: #38bdf8; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .status { font-size: 12px; color: #fbbf24; font-style: italic; margin-bottom: 10px; text-align: center; }
        .preview-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .preview-box { flex: 1; text-align: center; }
        .preview-img { width: 100%; max-height: 150px; object-fit: contain; border-radius: 6px; background: #000; border: 1px solid #38bdf8; display: none; }
        .preview-label { font-size: 10px; color: #38bdf8; margin-bottom: 3px; display: block; }
        .comparison-box { padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
        .match-verified { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .fake-not-match { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    </style>
</head>
<body>

<div class="card">
    <h2>Triple-Gate Anti-Fake Inspector</h2>
    
    <div class="form-group">
        <label>Pumili ng Larawan ng Resibo sa File Manager:</label>
        <!-- Tinanggal ang accept strict para buksan ang buong File Manager UI -->
        <input type="file" id="receiptFile" onchange="processReceipt(event)">
    </div>

    <!-- Textview para sa Nabasang Filename -->
    <div class="form-group">
        <label>📁 Na-detect na Filename (Gate 1):</label>
        <div id="fileNameView" class="view-box">-- Walang file na napili --</div>
    </div>

    <!-- Preview ng Dalawang Na-crop na Bahagi -->
    <div class="preview-grid">
        <div class="preview-box">
            <span class="preview-label">📱 1. Status Bar Crop</span>
            <img id="statusBarPreview" class="preview-img" alt="Status Bar Preview">
        </div>
        <div class="preview-box">
            <span class="preview-label">🧾 2. Receipt Crop (9:16)</span>
            <img id="receiptPreview" class="preview-img" alt="Receipt Preview">
        </div>
    </div>
    
    <div id="statusMsg" class="status">Mag-upload ng resibo upang simulan ang pagsusuri...</div>

    <div class="form-group">
        <label>⏰ Oras sa Status Bar (statusbar_detected_time):</label>
        <div id="statusBarTimeView" class="view-box">-- Naghihintay --</div>
    </div>

    <div class="form-group">
        <label>📅 Petsa at Oras sa Resibo (detected_time):</label>
        <div id="receiptTimeView" class="view-box">-- Naghihintay --</div>
    </div>

    <div class="form-group">
        <label>🔢 Nakuhang Reference Number:</label>
        <div id="refNumView" class="view-box" style="color: #34d399; font-weight: bold;">-- Naghihintay --</div>
    </div>

    <!-- Result Badge Indicator -->
    <div id="comparisonResult" class="comparison-box"></div>

    <div class="form-group" style="margin-top: 15px;">
        <label>📦 Pinagsamang JSON Data (Triple-Gate Output):</label>
        <div id="jsonView" class="view-box json-box">-- Walang data --</div>
    </div>
</div>

<script>
async function cropStatusBar(imageFile) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const cropHeight = img.height * 0.12; 
            canvas.width = img.width;
            canvas.height = cropHeight;

            ctx.drawImage(img, 0, 0, img.width, cropHeight, 0, 0, img.width, cropHeight);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.95);
        };
        img.src = URL.createObjectURL(imageFile);
    });
}

async function cropTo916AndRemoveStatusBar(imageFile) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const cropTopPercent = 0.07; 
            const originalSourceY = img.height * cropTopPercent;
            const originalSourceHeight = img.height * (1 - cropTopPercent);
            
            let sx = 0, sy = originalSourceY, sWidth = img.width, sHeight = originalSourceHeight;
            const targetAspect = 9 / 16;
            const currentAspect = sWidth / sHeight;

            if (currentAspect > targetAspect) {
                const newWidth = sHeight * targetAspect;
                sx = sx + (sWidth - newWidth) / 2;
                sWidth = newWidth;
            } else if (currentAspect < targetAspect) {
                sHeight = sWidth / targetAspect;
            }

            canvas.width = sWidth;
            canvas.height = sHeight;
            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.95);
        };
        img.src = URL.createObjectURL(imageFile);
    });
}

function timeToMinutes(timeStr) {
    if (!timeStr) return null;
    let cleanStr = timeStr.trim().toUpperCase();
    let isPM = cleanStr.includes('PM');
    let isAM = cleanStr.includes('AM');
    
    cleanStr = cleanStr.replace(/AM|PM/g, '').trim();
    let parts = cleanStr.split(':');
    if (parts.length < 2) return null;
    
    let hours = parseInt(parts[0], 10);
    let minutes = parseInt(parts[1], 10);
    
    if (isNaN(hours) || isNaN(minutes)) return null;
    
    if (isPM && hours < 12) hours += 12;
    if (isAM && hours === 12) hours = 0;
    
    return (hours * 60) + minutes;
}

// Helper para i-normalize ang petsa para sa Gate 2 comparison
function normalizeDate(dateStr) {
    if (!dateStr) return "";
    try {
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const da = String(d.getDate()).padStart(2, '0');
            return `${yr}${mo}${da}`;
        }
    } catch(e) {}
    return dateStr.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
}

async function processReceipt(event) {
    const file = event.target.files[0];
    const statusMsg = document.getElementById('statusMsg');
    const fileNameView = document.getElementById('fileNameView');
    const statusBarTimeView = document.getElementById('statusBarTimeView');
    const receiptTimeView = document.getElementById('receiptTimeView');
    const refNumView = document.getElementById('refNumView');
    const jsonView = document.getElementById('jsonView');
    const statusBarPreview = document.getElementById('statusBarPreview');
    const receiptPreview = document.getElementById('receiptPreview');
    const comparisonResult = document.getElementById('comparisonResult');

    if (!file) return;

    comparisonResult.style.display = 'none';
    fileNameView.innerText = "-- Naglo-load --";
    statusBarTimeView.innerText = "-- Naglo-load --";
    receiptTimeView.innerText = "-- Naglo-load --";
    refNumView.innerText = "-- Naglo-load --";
    jsonView.innerText = "-- Naglo-load --";

    const fileName = file.name.trim();
    fileNameView.innerText = fileName;

    // ==========================================
    // GATE 1: FILENAME PATTERN & METADATA GUARD
    // ==========================================
    const screenshotRegex = /^Screenshot_(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/i;
    const filenameMatch = fileName.match(screenshotRegex);

    if (!filenameMatch) {
        statusMsg.innerText = "❌ Nai-reject sa Gate 1: Invalid o Fake/Manipulated File!";
        comparisonResult.style.display = 'block';
        comparisonResult.className = "comparison-box fake-not-match";
        comparisonResult.innerHTML = `Fake 📵 Invalid Filename (Gate 1)<br><span style="font-size:11px; font-weight:normal;">Ang filename (${fileName}) ay hindi lehitimong screenshot (Maaaring galing sa web download, Canva, o pinalitan ang pangalan).</span>`;
        
        jsonView.innerText = JSON.stringify({
            success: false,
            gate_failed: "Gate 1",
            reason: "Invalid screenshot filename pattern",
            filename: fileName
        }, null, 2);
        return;
    }

    // Kunin ang Date (YYYYMMDD) at Time (HHMMSS) mula sa filename para sa Gate 2
    const fileYear = filenameMatch[1];
    const fileMonth = filenameMatch[2];
    const fileDay = filenameMatch[3];
    const fileDateStr = `${fileYear}${fileMonth}${fileDay}`; // hal. "20261107"

    const fileTimeStr = filenameMatch[4] + filenameMatch[5]; // HHMM
    const fHour = parseInt(filenameMatch[4], 10);
    const fMin = parseInt(filenameMatch[5], 10);
    const filenameMinutes = (fHour * 60) + fMin;

    statusMsg.innerText = "🛡️ Nakapasa sa Gate 1! Sinisimulan ang pag-crop at OCR...";

    try {
        const statusBarBlob = await cropStatusBar(file);
        const receiptBlob = await cropTo916AndRemoveStatusBar(file);

        statusBarPreview.src = URL.createObjectURL(statusBarBlob);
        statusBarPreview.style.display = 'block';

        receiptPreview.src = URL.createObjectURL(receiptBlob);
        receiptPreview.style.display = 'block';

        statusMsg.innerText = "⏳ Isinasagawa ang Dual OCR (Status Bar + Resibo)...";

        // OCR para sa Status Bar
        const statusBarOcr = await Tesseract.recognize(statusBarBlob, 'eng');
        const sbText = statusBarOcr.data.text.trim();
        const timeMatchSB = sbText.match(/\d{1,2}:\d{2}/);
        const statusbar_detected_time = timeMatchSB ? timeMatchSB[0] : "Hindi natukoy";
        statusBarTimeView.innerText = statusbar_detected_time;

        // OCR para sa Resibo
        const receiptOcr = await Tesseract.recognize(receiptBlob, 'eng', {
            logger: m => {
                if (m.status === 'recognizing text') {
                    statusMsg.innerText = `⏳ Receipt OCR Progress: ${Math.round(m.progress * 100)}%`;
                }
            }
        });

        statusMsg.innerText = "✅ Matagumpay na nasuri ang mga bahagi ng resibo!";

        const rawLines = receiptOcr.data.text.split('\n')
                                   .map(l => l.trim())
                                   .filter(l => l.length > 0);

        const dateRegex = /(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s*\d{1,2},?\s*\d{4}|\d{2}[-/]\d{2}[-/]\d{4}/i;
        const timeRegex = /\b\d{1,2}:\d{2}(?:\:\d{2})?\s?(?:AM|PM|am|pm)?\b/i;

        let detectedDateStr = "Hindi natagpuan";
        let detected_time = "Hindi natagpuan";

        for (let i = 0; i < rawLines.length; i++) {
            const line = rawLines[i];
            if (detectedDateStr === "Hindi natagpuan") {
                const dMatch = line.match(dateRegex);
                if (dMatch) detectedDateStr = dMatch[0];
            }
            if (detected_time === "Hindi natagpuan") {
                const isTimeKeyword = /^(?:Time|Oras|Transaction\s*Time)\b/i.test(line);
                if (isTimeKeyword) {
                    const sameLineTime = line.match(timeRegex);
                    if (sameLineTime) detected_time = sameLineTime[0];
                    else if (i + 1 < rawLines.length) {
                        const nextLineTime = rawLines[i + 1].match(timeRegex);
                        if (nextLineTime) detected_time = nextLineTime[0];
                    }
                }
            }
        }

        if (detected_time === "Hindi natagpuan") {
            for (let line of rawLines) {
                const tMatch = line.match(timeRegex);
                if (tMatch) { detected_time = tMatch[0]; break; }
            }
        }

        receiptTimeView.innerText = detectedDateStr + " | " + detected_time;

        // Pagkuha ng Reference Number
        let foundReferenceNumber = "";
        for (let i = 0; i < rawLines.length; i++) {
            const currentLine = rawLines[i];
            const hasKeyword = /Reference\s*(?:No\.?|Number|ID)|Ref\.?\s*No\.?|Payment\s*ID|Invoice\s*number/i.test(currentLine);
            if (hasKeyword) {
                let candidate = "";
                const matchInSameLine = currentLine.match(/(?:Reference\s*(?:No\.?|Number|ID)|Ref\.?\s*No\.?|Payment\s*ID|Invoice\s*number)\s*[:\s]*([A-Z0-9\-\s]{6,30})/i);
                if (matchInSameLine && matchInSameLine[1]) {
                    candidate = matchInSameLine[1].trim();
                } else if (i + 1 < rawLines.length) {
                    candidate = rawLines[i + 1].trim();
                }
                if (candidate) {
                    candidate = candidate.split(/(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|\b20\d{2}\b)/i)[0].trim();
                    let cleanMatch = candidate.match(/^[A-Z0-9\-\s]{6,25}/i);
                    if (cleanMatch) {
                        let refined = cleanMatch[0].trim().replace(/\s+0$/, '');
                        if (refined.length >= 6 && !refined.toLowerCase().includes('proof')) {
                            foundReferenceNumber = refined;
                            break;
                        }
                    }
                }
            }
        }

        if (foundReferenceNumber) {
            refNumView.style.color = "#34d399";
            refNumView.innerText = foundReferenceNumber;
        } else {
            refNumView.style.color = "#f43f5e";
            refNumView.innerText = "⚠️ Hindi natagpuan ang Reference No.";
        }

        // ==========================================
        // GATE 2: FILENAME DATE/TIME VS. RECEIPT DATE/TIME
        // ==========================================
        const receiptMinutes = timeToMinutes(detected_time);
        let gate2Passed = true;
        let gate2Diff = null;

        // 1. Suriin muna kung tumutugma ang petsa ng filename sa petsa ng resibo
        const normalizedFileDate = fileDateStr; // YYYYMMDD
        const normalizedReceiptDate = normalizeDate(detectedDateStr); // YYYYMMDD equivalent

        let dateMatches = false;
        if (normalizedReceiptDate && normalizedFileDate) {
            if (normalizedReceiptDate.includes(fileYear) && normalizedReceiptDate.includes(fileMonth) && normalizedReceiptDate.includes(fileDay)) {
                dateMatches = true;
            }
        } else {
            // Kung hindi mabasa ng OCR ang petsa pero pumasa sa iba, i-default sa true o patotohanan base sa safety
            dateMatches = true; 
        }

        if (!dateMatches) {
            gate2Passed = false; // Bagsak agad dahil magkaiba ang petsa kahit pareho ang oras[span_2](start_span)[span_2](end_span)!
        } else if (receiptMinutes !== null) {
            gate2Diff = Math.abs(filenameMinutes - receiptMinutes);
            if (gate2Diff > 720) gate2Diff = 1440 - gate2Diff;

            // Agwat limit na 2 minuto
            if (gate2Diff > 2) {
                gate2Passed = false;
            }
        }

        // ==========================================
        // GATE 3: DUAL OCR STATUS BAR VS. RECEIPT TIME
        // ==========================================
        const sbMinutes = timeToMinutes(statusbar_detected_time);
        let gate3Passed = true;
        let gate3Diff = null;

        if (sbMinutes !== null && receiptMinutes !== null) {
            gate3Diff = Math.abs(sbMinutes - receiptMinutes);
            if (gate3Diff > 720) gate3Diff = 1440 - gate3Diff;

            if (gate3Diff > 2) {
                gate3Passed = false;
            }
        } else {
            gate3Passed = false;
        }

        // Pinal na Desisyon mula sa Triple-Gate
        comparisonResult.style.display = 'block';
        let verificationStatus = "";

        if (gate2Passed && gate3Passed) {
            verificationStatus = "Match Verified ✅";
            comparisonResult.className = "comparison-box match-verified";
            comparisonResult.innerHTML = `Match Verified ✅<br><span style="font-size:11px; font-weight:normal;">Ligtas ang lahat ng Gates! Tugma ang petsa at oras (Agwat: ${gate2Diff}m).</span>`;
        } else {
            verificationStatus = "Fake 📵 Not Match (Date/Time Mismatch)";
            comparisonResult.className = "comparison-box fake-not-match";
            comparisonResult.innerHTML = `Fake 📵 Not Match<br><span style="font-size:11px; font-weight:normal;">Bigo sa Gate 2 (Magkaiba ang petsa o lampas 2 min agwat) o Gate 3.</span>`;
        }

        // Pinagsamang JSON Output
        const finalResultJson = {
            success: true,
            verification_status: verificationStatus,
            timestamp_scanned: new Date().toISOString(),
            gate_checks: {
                gate_1_filename: "Passed ✅",
                gate_2_filename_vs_receipt: gate2Passed ? "Passed ✅" : "Failed ❌ (Date/Time Mismatch)",
                gate_3_statusbar_vs_receipt: gate3Passed ? "Passed ✅" : "Failed ❌"
            },
            filename_extracted: {
                file_name: fileName,
                date: fileDateStr
            },
            status_bar_ocr: {
                statusbar_detected_time: statusbar_detected_time
            },
            receipt_ocr: {
                detected_date: detectedDateStr,
                detected_time: detected_time,
                reference_number: foundReferenceNumber || "Hindi natagpuan"
            }
        };

        jsonView.innerText = JSON.stringify(finalResultJson, null, 2);

    } catch (err) {
        console.error(err);
        statusMsg.innerText = "❌ May naganap na error sa pagproseso ng Triple-Gate system.";
    }
}
</script>

</body>
</html>
