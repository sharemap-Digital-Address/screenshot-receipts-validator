<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P X-Ray Forensic Inspector</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        h2 { color: #38bdf8; font-size: 18px; margin-top: 0; }
        input[type="file"] { width: 100%; color: #fff; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .preview-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .img-container { flex: 1; background: #0f172a; padding: 5px; border-radius: 6px; border: 1px solid #334155; }
        .img-container img, .img-container canvas { width: 100%; max-height: 180px; object-fit: contain; border-radius: 4px; display: block; }
        .label { font-size: 11px; color: #94a3b8; margin-bottom: 5px; display: block; font-weight: bold; }
        .uv-button { background: #7c3aed; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: background 0.2s; }
        .uv-button:hover { background: #6d28d9; }
        .badge { padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; display: none; }
        .badge-real { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .badge-ai { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
        .log-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; color: #38bdf8; text-align: left; white-space: pre-wrap; margin-top: 15px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔍 P2P X-Ray Forensic Inspector</h2>
        <p style="font-size: 12px; color: #94a3b8;">Smart Filename Check + ELA Compression Analysis</p>
        
        <input type="file" id="imageInput" accept="image/*" onchange="inspectImage(event)">
        
        <!-- X-Ray UV Light Scanner Toggle Button -->
        <button class="uv-button" onclick="toggleUVXRay()">💡 Turn on X-Ray UV Light Filter</button>

        <div class="preview-box">
            <div class="img-container">
                <span class="label">🖼️ Uploaded Receipt</span>
                <img id="origPreview" style="display:none;">
            </div>
            <div class="img-container">
                <span class="label">🔬 ELA X-Ray Map</span>
                <canvas id="elaCanvas" style="display:none;"></canvas>
            </div>
        </div>

        <div id="resultBadge" class="badge"></div>
        <div class="log-box" id="logBox">{ "status": "Mag-upload ng resibo para sa X-ray scan..." }</div>
    </div>

    <script>
        let currentFile = null;

        async function inspectImage(event) {
            currentFile = event.target.files[0];
            const origPreview = document.getElementById('origPreview');
            const elaCanvas = document.getElementById('elaCanvas');
            const resultBadge = document.getElementById('resultBadge');
            const logBox = document.getElementById('logBox');
            if (!currentFile) return;

            origPreview.src = URL.createObjectURL(currentFile);
            origPreview.style.display = 'block';
            resultBadge.style.display = 'none';
            logBox.innerText = "⏳ Sinusuri ang Filename Timestamp at ELA Compression...";
            
            let scoreFake = 0;
            let logs = [];

            // 1. Smart Filename & Timestamp Verification
            const fileName = currentFile.name;
            logs.push(`📁 Filename: ${fileName}`);
            
            if (fileName.includes("GCash_Receipt_") || fileName.includes("Maya_Receipt_")) {
                logs.push("✅ Smart Filename Format Match: Pasok sa tamang timestamp at ref format.");
            } else {
                scoreFake += 30;
                logs.push("⚠️ Babala: Hindi sumunod sa opisyal na Smart Filename format (Posibleng pinalitan o in-rename).");
            }

            // 2. Metadata Check
            try {
                const metadata = await exifr.parse(currentFile, true).catch(() => null);
                if (metadata && metadata.Software) {
                    const software = metadata.Software.toString().toLowerCase();
                    if (software.includes('photoshop') || software.includes('canva') || software.includes('gimp')) {
                        scoreFake += 50;
                        logs.push(`🚨 Alerto: Nakitaan ng editing software signature ("${software}")!`);
                    }
                }
            } catch (err) {
                logs.push("ℹ️ Standard mobile metadata verified.");
            }

            // 3. ELA Analysis
            const elaVariance = await performELA(currentFile, origPreview, elaCanvas);
            logs.push(`📊 ELA Variance Score: ${elaVariance.toFixed(2)}`);
            
            if (elaVariance > 38) {
                scoreFake += 40;
                logs.push("🚨 Mataas ang ELA variance: May binagong pixels o numero sa resibo.");
            } else {
                logs.push("✅ Pantay at balanse ang pixel compression ng buong resibo.");
            }

            resultBadge.style.display = 'block';
            if (scoreFake >= 40) {
                resultBadge.className = "badge badge-ai";
                resultBadge.innerHTML = `⚠️ POSIBLENG PEKE / INEDIT NA RESIBO 📵<br><span style="font-size:11px; font-weight:normal;">Sumablay sa X-ray ELA o Filename Check.</span>`;
            } else {
                resultBadge.className = "badge badge-real";
                resultBadge.innerHTML = `✅ VERIFIED ORIHINAL NA RESIBO 📱<br><span style="font-size:11px; font-weight:normal;">Pasok sa X-ray UV at ELA standards.</span>`;
            }
            logBox.innerText = logs.join('\n');
        }

        function toggleUVXRay() {
            const canvas = document.getElementById('elaCanvas');
            if (canvas.style.filter === 'invert(100%) contrast(200%)') {
                canvas.style.filter = 'none';
                alert("X-ray UV Light Mode: OFF");
            } else {
                canvas.style.filter = 'invert(100%) contrast(200%)';
                alert("X-ray UV Light Mode: ON - Sinusuri ang hidden marks!");
            }
        }

        function performELA(file, imgEl, canvas) {
            return new Promise((resolve) => {
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.style.display = 'block';
                    ctx.drawImage(img, 0, 0);
                    const originalData = ctx.getImageData(0, 0, img.width, img.height);
                    
                    canvas.toBlob((blob) => {
                        const compImg = new Image();
                        compImg.onload = () => {
                            ctx.drawImage(compImg, 0, 0);
                            const compData = ctx.getImageData(0, 0, img.width, img.height);
                            let totalDiff = 0;
                            const diffPixels = ctx.createImageData(img.width, img.height);
                            
                            for (let i = 0; i < originalData.data.length; i += 4) {
                                const r = Math.abs(originalData.data[i] - compData.data[i]) * 10;
                                const g = Math.abs(originalData.data[i+1] - compData.data[i+1]) * 10;
                                const b = Math.abs(originalData.data[i+2] - compData.data[i+2]) * 10;
                                diffPixels.data[i] = r; diffPixels.data[i+1] = g; diffPixels.data[i+2] = b; diffPixels.data[i+3] = 255;
                                totalDiff += (r + g + b) / 3;
                            }
                            ctx.putImageData(diffPixels, 0, 0);
                            resolve(totalDiff / (img.width * img.height));
                        };
                        compImg.src = URL.createObjectURL(blob);
                    }, 'image/jpeg', 0.70);
                };
                img.src = URL.createObjectURL(file);
            });
        }
    </script>
</body>
</html>
